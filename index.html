<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>CEM Hub - Academic & Leadership Development in Lafia</title>

<meta name="description" content="CEM Hub develops purpose-driven leaders through mentorship, leadership training, and academic excellence in Lafia, Nigeria."/>
<link rel="icon" href="/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

<style>
:root{--primary:#0a1f3d;--accent:#c9a646;--bg:#f7f9fc;--text:#111827;--muted:#6b7280;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;color:var(--text);background:white;}
section{padding:6rem 2rem;}
.container{max-width:1200px;margin:auto;}
header{position:fixed;top:0;width:100%;z-index:4000;display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid #eee;}
.logo img{height:42px;width:auto;}
nav ul{display:flex;gap:2rem;list-style:none;}
nav a{text-decoration:none;color:var(--primary);}
.hero{min-height:72vh;display:flex;align-items:center;justify-content:center;text-align:center;color:white;padding:7rem 2rem 4rem;background:linear-gradient(rgba(10,31,61,0.72),rgba(10,31,61,0.72)),url('IMG-20250731-WA0247.jpg');background-size:cover;background-position:center;}
.btn{margin-top:2rem;padding:0.95rem 2rem;border:none;border-radius:6px;background:var(--accent);color:white;cursor:pointer;font-weight:600;}
footer{background:#0a1f3d;color:white;text-align:center;padding:2rem;}
/* MODAL */
.modal{display:none;position:fixed;z-index:6000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;padding:1rem;}
.modal.active{display:flex;}
.modal-content{background:white;padding:2.5rem 2rem;border-radius:16px;max-width:450px;width:100%;position:relative;}
.close{position:absolute;top:1rem;right:1.2rem;font-size:1.8rem;cursor:pointer;}
form input{width:100%;padding:1rem;margin-bottom:1rem;border:1px solid #ddd;border-radius:6px;}
</style>
</head>

<body>

<header>
  <div class="logo">
    <img src="BackgroundEraser_20260510_060102032.png" alt="CEM Hub Logo">
  </div>
  <nav><ul><li><a href="#">Home</a></li><li><a href="#contact">Contact</a></li></ul></nav>
</header>

<section class="hero">
  <div>
    <h1>CEM Hub FUlafia</h1>
    <p>A community committed to academic excellence and leadership development.</p>
    <button class="btn" onclick="openModal()">Join CEM Hub</button>
  </div>
</section>

<section id="contact" style="padding:6rem 2rem;text-align:center;">
  <h2>Contact</h2>
</section>

<footer>
  <p>© 2026 CEM Hub. All rights reserved.</p>
</footer>

<!-- JOIN MODAL -->
<div id="joinModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3>Join CEM Hub</h3>
    <form id="joinForm">
      <input type="text" name="full_name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="text" name="phone" placeholder="WhatsApp Number" required>
      <button type="submit" class="btn" style="width:100%;">Submit</button>
    </form>
  </div>
</div>

<script>
function openModal(){
  document.getElementById('joinModal').classList.add('active');
}
function closeModal(){
  document.getElementById('joinModal').classList.remove('active');
}
document.getElementById('joinForm').addEventListener('submit', function(e){
  e.preventDefault();
  alert('Form works! Next we will connect it to Supabase.');
  closeModal();
});
</script>

</body>
</html>
